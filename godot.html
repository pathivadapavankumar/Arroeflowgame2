		<style>
:root {
	color-scheme: light;
	--paper: #f6f5ef;
	--ink: #172b3a;
	--muted: #687783;
	--lime: #c8ef68;
	--coral: #f17961;
	--line: #dce3df;
}
* { box-sizing: border-box; }
html, body, #canvas { width: 100%; height: 100%; margin: 0; padding: 0; border: 0; }
html, body { overflow: hidden; background: var(--paper); }
body { color: var(--ink); font-family: "Nunito", "Avenir Next", system-ui, sans-serif; }
#canvas { position: absolute; inset: 0; display: block; outline: none; touch-action: none; }
#canvas:focus { outline: none; }
#status {
	position: fixed;
	z-index: 5;
	inset: 0;
	display: grid;
	place-items: center;
	padding: max(22px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(22px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
	background: var(--paper);
	text-align: center;
}
.loader-card { width: min(100%, 430px); padding: clamp(26px, 6vw, 44px); border: 1px solid rgba(23,43,58,.08); border-radius: 30px; background: rgba(255,255,255,.68); box-shadow: 0 22px 70px rgba(23,43,58,.08); }
#game-icon { width: 74px; height: 74px; display: block; margin: 0 auto 19px; border-radius: 20px; box-shadow: 0 8px 22px rgba(23,43,58,.12); }
h1 { margin: 0; color: var(--ink); font-size: clamp(28px, 8vw, 40px); line-height: 1; font-weight: 900; letter-spacing: .055em; }
#tagline { margin: 12px 0 24px; color: var(--muted); font-size: 15px; line-height: 1.5; }
#status-progress { display: block; width: min(100%, 280px); height: 12px; margin: 0 auto; overflow: hidden; border: 0; border-radius: 99px; background: #e7ece6; appearance: none; }
#status-progress::-webkit-progress-bar { border-radius: 99px; background: #e7ece6; }
#status-progress::-webkit-progress-value { border-radius: 99px; background: var(--lime); transition: width .18s ease-out; }
#status-progress::-moz-progress-bar { border-radius: 99px; background: var(--lime); }
#status-label { min-height: 22px; margin: 12px 0 0; color: var(--ink); font-size: 13px; font-weight: 800; }
#status-tip { margin: 8px 0 0; color: var(--muted); font-size: 12px; line-height: 1.45; }
#slow-notice { margin: 14px 0 0; color: var(--muted); font-size: 12px; }
#status-notice { display: none; margin: 18px 0 0; padding: 12px 14px; border: 1px solid #f1b7aa; border-radius: 14px; background: #fff0eb; color: #8c3d31; font-size: 13px; line-height: 1.45; overflow-wrap: anywhere; }
#retry { display: none; min-height: 46px; margin: 18px auto 0; padding: 0 24px; border: 0; border-radius: 99px; background: var(--ink); color: white; font: inherit; font-weight: 800; cursor: pointer; }
#retry:focus-visible { outline: 3px solid var(--coral); outline-offset: 3px; }
#status.error #status-progress, #status.error #status-label, #status.error #status-tip, #status.error #slow-notice { display: none; }
#status.error #status-notice, #status.error #retry { display: block; }
noscript { position: fixed; z-index: 8; inset: 0; display: grid; place-items: center; padding: 24px; background: var(--paper); color: var(--ink); text-align: center; }
@media (max-width: 420px) { .loader-card { border-radius: 24px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
		</style>

			html body #status #status-progress::-webkit-progress-bar { border-radius: 99px; background: #e7ece6; }

			html body #status.error #retry { display: inline-block !important; }

		<!-- arrowflow:custom-loading-loop -->
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);
(function () {
	const overlay = document.getElementById('status');
	const progress = document.getElementById('status-progress');
	const label = document.getElementById('status-label');
	const notice = document.getElementById('status-notice');
	const retry = document.getElementById('retry');
	const slowNotice = document.getElementById('slow-notice');
	let initializing = true;
	let statusMode = '';
	const slowTimer = window.setTimeout(() => {
		if (initializing) {
			slowNotice.hidden = false;
			retry.style.display = 'inline-block';
			retry.textContent = 'Retry';
		}
	}, 12000);
	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) return;
		if (mode === 'hidden') {
			window.clearTimeout(slowTimer);
			overlay.remove();
			initializing = false;
			return;
		}
		if (mode === 'progress') {
			overlay.classList.remove('error');
			progress.style.display = 'block';
			label.style.display = 'block';
			statusMode = mode;
		}
	}
	function setStatusNotice(text) {
		notice.replaceChildren();
		const lines = String(text).split('\n');
		lines.forEach((line, index) => {
			if (index > 0) notice.appendChild(document.createElement('br'));
			notice.appendChild(document.createTextNode(line));
		});
	}
	function displayFailureNotice(error) {
		console.error(error);
		setStatusNotice(error instanceof Error ? error.message : (typeof error === 'string' ? error : 'An unknown error occurred.'));
		overlay.classList.add('error');
		retry.style.display = 'inline-block';
		retry.textContent = 'Try again';
		initializing = false;
	}
	retry.addEventListener('click', () => window.location.reload());
	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		displayFailureNotice('Arrowflow cannot start because this browser is missing required features:\n' + missing.join('\n'));
	} else {
		setStatusMode('progress');
		engine.startGame({
			onProgress: function (current, total) {
				if (current > 0 && total > 0) {
					progress.value = current;
					progress.max = total;
					label.textContent = 'Loading game data…';
				} else {
					progress.removeAttribute('value');
					progress.removeAttribute('max');
					label.textContent = 'Preparing your puzzle space…';
				}
			},
		}).then(() => setStatusMode('hidden'), displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
